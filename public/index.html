<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicForUrl</title>
  <meta name="description" content="网易云音乐与 QQ 音乐歌单转换为播放链接。">
  <meta name="theme-color" content="#e5f6ff">
  <link rel="icon" href="/brand.svg" type="image/svg+xml">
  <script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pagination.css">
</head>
<body>
  <div class="container app-shell">
    <div id="header-placeholder"></div>
    <div class="workspace">
      <header class="workspace-bar">
        <div class="workspace-location"><span>工作台</span><span aria-hidden="true">/</span><strong id="workspaceLocation">链接生成</strong></div>
        <label class="theme-switch" title="切换深色模式"><input type="checkbox" id="themeToggle" onchange="toggleTheme()" aria-label="深色模式"><span class="theme-icon"><svg class="icon moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8 8 0 0 1 9.8 4a8.2 8.2 0 1 0 10.4 10.2Z"/></svg><svg class="icon sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></span></label>
      </header>
      <main id="appView" tabindex="-1">
      <div style="text-align:center; padding: 2rem;">
        <span class="loading"></span>
      </div>
      </main>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/toast.js"></script>
  <script src="/js/error-utils.js"></script>
  <script src="/js/vendor/gsap-3.15.0.min.js"></script>
  <script src="/js/motion.js"></script>
  <script src="/js/workspace.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
