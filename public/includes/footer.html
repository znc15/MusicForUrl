<div id="modalContainer">
  <div class="modal-overlay" id="loginModal" aria-hidden="true">
    <section class="modal glass" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle" tabindex="-1">
      <button type="button" class="modal-close" onclick="hideLogin()" aria-label="关闭登录窗口"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      <h2 class="modal-title" id="loginModalTitle">登录网易云音乐</h2>
      <div class="login-platform-tabs" data-motion-tabs id="loginPlatformTabs" role="group" aria-label="登录平台">
        <button type="button" class="login-platform-tab active" id="loginPlatformNetease" aria-pressed="true" onclick="switchLoginPlatform('netease')">网易云音乐</button>
        <button type="button" class="login-platform-tab" id="loginPlatformQQ" aria-pressed="false" onclick="switchLoginPlatform('qq')">QQ 音乐</button>
      </div>
      <div class="motion-panels">
      <div id="neteaseLoginPanel" class="login-platform-panel active">
        <div class="login-tabs" data-motion-tabs role="group" aria-label="网易云登录方式">
          <button type="button" class="login-tab active" aria-pressed="true" onclick="switchLoginTab('qrcode')">扫码</button>
          <button type="button" class="login-tab" aria-pressed="false" onclick="switchLoginTab('captcha')">验证码</button>
          <button type="button" class="login-tab" aria-pressed="false" onclick="switchLoginTab('password')">密码</button>
          <button type="button" class="login-tab" aria-pressed="false" onclick="switchLoginTab('cookie')">Cookie</button>
        </div>
        <div class="motion-panels">
        <div class="login-content active" id="qrcodeContent">
          <div class="qr-code"><img id="qrCodeImg" src="/placeholder.svg" alt="网易云音乐登录二维码" referrerpolicy="no-referrer"></div>
          <div class="qr-status" id="qrStatus" role="status" aria-live="polite">网易云音乐 App 扫码</div>
          <button type="button" class="text-button qr-refresh" onclick="loadQRCode()">刷新二维码</button>
        </div>
        <div class="login-content" id="captchaContent">
          <div class="form-group"><label for="captchaPhone">手机号</label><input type="tel" id="captchaPhone" placeholder="手机号" autocomplete="tel"></div>
          <div class="form-group"><label for="captchaCode">验证码</label><div class="captcha-group"><input type="text" id="captchaCode" placeholder="验证码" inputmode="numeric" autocomplete="one-time-code"><button type="button" class="btn btn-ghost" id="sendCaptchaBtn" onclick="sendCaptcha()">发送</button></div></div>
          <button type="button" class="btn btn-primary full-width" onclick="loginWithCaptcha()">登录</button>
        </div>
        <div class="login-content" id="passwordContent">
          <div class="form-group"><label for="passwordPhone">手机号</label><input type="tel" id="passwordPhone" placeholder="手机号" autocomplete="username"></div>
          <div class="form-group"><label for="passwordInput">密码</label><input type="password" id="passwordInput" placeholder="密码" autocomplete="current-password"></div>
          <button type="button" class="btn btn-primary full-width" onclick="loginWithPassword()">登录</button>
        </div>
        <div class="login-content" id="cookieContent">
          <div class="form-group"><label for="cookieInput">Cookie</label><textarea id="cookieInput" placeholder="粘贴 Cookie" rows="4" spellcheck="false" autocomplete="off"></textarea></div>
          <button type="button" class="btn btn-primary full-width" onclick="loginWithCookie()">登录</button>
        </div>
        </div>
      </div>
      <div id="qqLoginPanel" class="login-platform-panel"><div class="login-content active" id="qqQrcodeContent"><div class="qr-code"><img id="qqQrCodeImg" src="/placeholder.svg" alt="QQ 音乐登录二维码" referrerpolicy="no-referrer"></div><div class="qr-status" id="qqQrStatus" role="status" aria-live="polite">QQ 扫码</div><button type="button" class="text-button qr-refresh" onclick="loadQQQRCode()">刷新二维码</button></div></div>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
