name: Cloudflare checks

on:
  push:
    branches: [codex/cloudflare]
  pull_request:
    branches: [codex/cloudflare]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cloudflare/package-lock.json
      - run: npm ci --prefix web
      - run: npm ci --prefix cloudflare
      - run: npm test
      - run: npm run build:worker
